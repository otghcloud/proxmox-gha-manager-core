name: Validate Markdown

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Lint
    permissions:
      contents: write
    # Reinstate the self-hosted label once the runner fleet is healthy again.
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'

      - name: Identify changed files
        uses: tj-actions/changed-files@v47.0.6
        id: changed-files
        with:
          files: '**/*.md'
          files_ignore: 'vendor/**,node_modules/**'
          separator: ','

      - name: Markdown Lint
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: ${{ steps.changed-files.outputs.all_changed_files }}
          separator: ','
          config: '.github/rules/.markdownlint.jsonc'
          fix: true

      - name: Commit fixes
        if: >-
          steps.changed-files.outputs.any_changed == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'style: Auto-fix markdown lint issues'
          file_pattern: '**/*.md'

  markdown-links:
    name: Check links
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'

      - name: Detect changed Markdown files
        id: changed
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: '**/*.md'
          files_ignore: 'vendor/**,node_modules/**'

      - name: Markdown links
        if: github.event_name != 'pull_request' || steps.changed.outputs.any_changed == 'true'
        uses: tcort/github-action-markdown-link-check@v1.1.3
        with:
          check-modified-files-only: yes
          config-file: '.github/rules/mlc_config.json'
          base-branch: 'main'

  all-checks-passed:
    name: Validate Markdown / All checks passed
    runs-on: ubuntu-slim
    permissions: {}
    needs:
      - markdown-lint
      - markdown-links
    if: always()
    steps:
      - name: Check all jobs passed
        shell: bash
        run: |
          set -euo pipefail

          results=(
            "${{ needs.markdown-lint.result }}"
            "${{ needs.markdown-links.result }}"
          )

          for result in "${results[@]}"; do
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "One or more required jobs did not succeed."
              exit 1
            fi
          done
